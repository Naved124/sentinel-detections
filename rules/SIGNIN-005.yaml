id: 255b206f-0927-4b28-b16c-e05b25947e6c
ruleId: SIGNIN-005
name: Successful sign-in with legacy authentication
description: |
  An account signed in successfully over a legacy authentication protocol such as IMAP, POP3,
  SMTP AUTH or Exchange ActiveSync with basic auth. These protocols cannot do MFA, so attackers
  with a sprayed or leaked password use them to get around MFA and Conditional Access.
severity: Medium
kind: Scheduled
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes: [SigninLogs]
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: [InitialAccess, DefenseEvasion]
relevantTechniques: [T1078.004]
query: |
  let lookback = 1h;
  let legacy_clients = dynamic(["Exchange ActiveSync", "IMAP4", "POP3", "Authenticated SMTP",
      "Exchange Web Services", "MAPI Over HTTP", "Offline Address Book", "Other clients", "AutoDiscover",
      "Exchange Online PowerShell", "Outlook Anywhere (RPC over HTTP)", "Reporting Web Services", "Universal Outlook"]);
  SigninLogs
  | where TimeGenerated > ago(lookback)
  | where ResultType == "0"
  | where ClientAppUsed in (legacy_clients)
  | summarize SignIns = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated),
      IPAddress = take_any(IPAddress), AllIPs = make_set(IPAddress, 20), Apps = make_set(AppDisplayName, 10),
      UserAgents = make_set(UserAgent, 10)
      by UserPrincipalName, ClientAppUsed
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: UserPrincipalName
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
triage:
  steps:
    - Check whether this user has a known reason to use the protocol (an old printer or scanner sending mail, a legacy app).
    - Look up AllIPs. Legacy-auth abuse typically comes from hosting providers rather than the user's normal networks.
    - Check the mailbox for new inbox rules, forwarding, or bulk reads after FirstSeen.
    - If it is not a known device, reset the password and block legacy authentication with Conditional Access.
  falsePositives:
    - Multifunction printers or scanners using SMTP AUTH to send scans by email.
    - Old mail clients or line-of-business apps that were never moved to modern authentication.
  escalateWhen: |
    Escalate if no known device explains it, if the IPs are hosting or VPN ranges, or if the
    mailbox shows rules or forwarding added after the sign-in.
tests:
  - name: IMAP sign-in from a hosting IP fires
    data:
      SigninLogs:
        - { at: -20m, UserPrincipalName: erin@example.com, IPAddress: 203.0.113.90, ResultType: "0", ClientAppUsed: IMAP4, AppDisplayName: Office 365 Exchange Online, UserAgent: python-imaplib }
    expect:
      rows: 1
      match: { UserPrincipalName: erin@example.com, ClientAppUsed: IMAP4, SignIns: 1, IPAddress: 203.0.113.90 }
  - name: modern browser sign-in does not fire
    data:
      SigninLogs:
        - { at: -20m, UserPrincipalName: erin@example.com, IPAddress: 198.51.100.50, ResultType: "0", ClientAppUsed: Browser }
        - { at: -10m, UserPrincipalName: erin@example.com, IPAddress: 198.51.100.50, ResultType: "0", ClientAppUsed: Mobile Apps and Desktop clients }
    expect: { rows: 0 }
  - name: blocked legacy sign-in attempt does not fire
    data:
      SigninLogs:
        - { at: -20m, UserPrincipalName: erin@example.com, IPAddress: 203.0.113.90, ResultType: "53003", ClientAppUsed: IMAP4 }
    expect: { rows: 0 }
