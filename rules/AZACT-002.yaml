id: 378cde5c-2d0e-4262-b6a7-7e7d9a04100b
ruleId: AZACT-002
name: Owner, Contributor or User Access Administrator role assigned in Azure
description: |
  Someone was granted Owner, Contributor or User Access Administrator on an Azure scope. These
  roles allow full control of resources (and, for Owner and User Access Administrator, granting
  access to others), so a new assignment is a common persistence and escalation step.
severity: High
kind: Scheduled
requiredDataConnectors:
  - connectorId: AzureActivity
    dataTypes: [AzureActivity]
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: [PrivilegeEscalation, Persistence]
relevantTechniques: [T1098.003]
query: |
  let lookback = 1h;
  // Built-in role definition IDs are the same in every tenant.
  let privileged_roles = dynamic({
      "8e3af657-a8ff-443c-a75c-2fe8c4bcb635": "Owner",
      "b24988ac-6180-42a0-ab88-20f7382dd24c": "Contributor",
      "18d7d88d-d35e-4fb5-a5c3-7773c20a72d9": "User Access Administrator"});
  AzureActivity
  | where TimeGenerated > ago(lookback)
  | where OperationNameValue =~ "MICROSOFT.AUTHORIZATION/ROLEASSIGNMENTS/WRITE"
  | extend Body = parse_json(tostring(Properties_d.requestbody))
  | extend Assignment = iff(isnotempty(Body.Properties), Body.Properties, Body.properties)
  | where isnotempty(Assignment)
  | extend RoleDefinitionId = tolower(tostring(coalesce(Assignment.RoleDefinitionId, Assignment.roleDefinitionId)))
  | extend RoleGuid = extract(@"([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$", 1, RoleDefinitionId)
  | extend RoleName = tostring(privileged_roles[RoleGuid])
  | where isnotempty(RoleName)
  | extend PrincipalId = tostring(coalesce(Assignment.PrincipalId, Assignment.principalId)),
           PrincipalType = tostring(coalesce(Assignment.PrincipalType, Assignment.principalType)),
           Scope = tostring(coalesce(Assignment.Scope, Assignment.scope))
  | summarize arg_max(TimeGenerated, RoleName, PrincipalId, PrincipalType, Scope, Caller, CallerIpAddress, _ResourceId)
      by CorrelationId
  | project TimeGenerated, RoleName, PrincipalId, PrincipalType, Scope, Caller, CallerIpAddress, _ResourceId, CorrelationId
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Caller
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: CallerIpAddress
  - entityType: AzureResource
    fieldMappings:
      - identifier: ResourceId
        columnName: _ResourceId
triage:
  steps:
    - Resolve PrincipalId to a user, group or service principal and check whether it is new.
    - Confirm the assignment with the Caller and against change records.
    - Check the scope - an assignment on a whole subscription or management group is far more serious than on one resource group.
    - Review the Caller's sign-ins around TimeGenerated for compromise.
    - If unauthorised, remove the assignment and review what the principal did with it.
  falsePositives:
    - Infrastructure-as-code pipelines that assign roles to new managed identities.
    - Planned onboarding of a new administrator or team.
  escalateWhen: |
    Escalate if the Caller or change records do not explain it, or if Owner or User Access
    Administrator was granted at subscription or management-group scope.
tests:
  - name: Owner granted at subscription scope fires
    data:
      AzureActivity:
        - at: -25m
          OperationNameValue: MICROSOFT.AUTHORIZATION/ROLEASSIGNMENTS/WRITE
          ActivityStatusValue: Start
          Caller: admin@example.com
          CallerIpAddress: 203.0.113.140
          CorrelationId: 7a6b5c4d-0000-4000-8000-000000000001
          _ResourceId: /subscriptions/00000000-0000-0000-0000-000000000001/providers/Microsoft.Authorization/roleAssignments/11111111-1111-1111-1111-111111111111
          Properties_d:
            requestbody: '{"Id":"11111111-1111-1111-1111-111111111111","Properties":{"PrincipalId":"22222222-2222-2222-2222-222222222222","PrincipalType":"User","RoleDefinitionId":"/subscriptions/00000000-0000-0000-0000-000000000001/providers/Microsoft.Authorization/roleDefinitions/8e3af657-a8ff-443c-a75c-2fe8c4bcb635","Scope":"/subscriptions/00000000-0000-0000-0000-000000000001"}}'
    expect:
      rows: 1
      match: { RoleName: Owner, PrincipalType: User, Scope: /subscriptions/00000000-0000-0000-0000-000000000001, Caller: admin@example.com }
  - name: Reader role is ignored
    data:
      AzureActivity:
        - at: -25m
          OperationNameValue: MICROSOFT.AUTHORIZATION/ROLEASSIGNMENTS/WRITE
          Caller: admin@example.com
          CorrelationId: 7a6b5c4d-0000-4000-8000-000000000002
          Properties_d:
            requestbody: '{"Properties":{"PrincipalId":"33333333-3333-3333-3333-333333333333","RoleDefinitionId":"/providers/Microsoft.Authorization/roleDefinitions/acdd72a7-3385-48ef-bd42-f606fba81ae7","Scope":"/subscriptions/0"}}'
    expect: { rows: 0 }
